on:
  pull_request_target:

name: CI - Pull Request
permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  set-env:
    name: "Set environment"
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.get_env.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{github.event.pull_request.head.repo.full_name}}
          ref: ${{ github.head_ref }}

      - name: Determine Environment
        id: get_env
        run: |
          codeowners=$(cat .github/CODEOWNERS) 
          if [[ $(echo "${codeowners[@]}" | fgrep -w "@${{github.actor}}") ]]; then
            echo PROWNER
            echo "env=pr_owner" >> $GITHUB_OUTPUT
          else
            echo PR
            echo "env=pr" >> $GITHUB_OUTPUT
          fi

  pull_request_checks:
    needs: set-env
    environment: ${{needs.set-env.outputs.env}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{github.event.pull_request.head.repo.full_name}}
          ref: ${{ github.head_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build bundled file
        run: yes | npx @vercel/ncc build src/main.ts

      - name: setup flutter test repos
        run: |
          cd tests/fail_repo
          flutter pub get
          cd ../pass_repo
          flutter pub get 
          cd ../..

      - name: run tests
        run: yarn run test

      - name: Check for modified files
        id: git-check
        run: echo "modified=$(if [ -n "$(git status --porcelain)" ]; then echo "true"; else echo "false"; fi)" >>  $GITHUB_ENV

      - name: Update changes in GitHub repository
        if: env.modified == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -A
          git commit -m 'ci(automated commit): Build bundled file'
          git push
