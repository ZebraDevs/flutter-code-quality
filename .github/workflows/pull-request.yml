on: pull_request

name: CI - Pull Request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pull_request_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build bundled file
        run: yarn build

      - name: setup flutter test repos
        run: |
          cd tests/fail_repo
          flutter pub get
          cd ../pass_repo
          flutter pub get

      - name: run tests
        run: yarn run test

      # Bot commits pushed with GITHUB_TOKEN don't trigger CI, so required checks would never report on them
      - name: Check bundled file is committed
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo "::error::dist is out of date. Run 'yarn build' and commit the result."
            exit 1
          fi
